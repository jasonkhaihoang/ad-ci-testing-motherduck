# dbt-duckdb profiles for the MotherDuck CI bundle.
#
# Two profiles ship:
#   dbt_motherduck_compile — offline, renders database: prd (Gates 0, 1, prod-state publish)
#   dbt_motherduck_ci      — live, MotherDuck-backed (Gates 2, 3, 4)
#
# CI workflows always pass --profiles-dir .github/profiles; no collision with ~/.dbt/profiles.yml.

dbt_motherduck_compile:
  target: compile
  outputs:
    compile:
      type: duckdb
      path: ':memory:'
      # dbt-duckdb>=1.9.4 requires an explicit attach clause to resolve a named
      # database (database: prd) against an in-memory path. Without it, dbt
      # errors with "Credentials invalid". See VD-2279.
      attach:
        - path: ':memory:'
          alias: prd
      database: prd          # matches MotherDuck production database name
      schema: main

dbt_motherduck_ci:
  target: ci
  outputs:
    ci:
      type: duckdb
      path: "md:pr_{{ env_var('PR_NUMBER') }}_{{ env_var('HEAD_SHA_SHORT') }}?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: main
