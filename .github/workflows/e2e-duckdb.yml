# E2E entry point for /test-ci-duckdb slash command.
# See docs/design/DuckDB/duckdb-motherduck-ci-workflow-design.md §E2E test design.
name: E2E — DuckDB CI

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'E2E scenario to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - greenfield
          - incremental-modify
          - incremental-staging

permissions:
  contents: read
  id-token: write

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.matrix.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4

      - name: Expand scenario matrix
        id: matrix
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from ci_database import build_scenario_matrix
          scenarios = build_scenario_matrix(os.environ['SCENARIO'])
          print(f"scenarios={json.dumps(scenarios)}")
          PY

  run-scenario:
    needs: [resolve-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario: ${{ fromJson(needs.resolve-matrix.outputs.scenarios) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ matrix.scenario }}
        env:
          SCENARIO: ${{ matrix.scenario }}
          E2E_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, '.github/scripts')
          from ci_database import derive_e2e_db_name

          scenario = os.environ['SCENARIO']
          run_id = os.environ['E2E_RUN_ID']
          db_name = derive_e2e_db_name(scenario, run_id)
          print(f"scenario={scenario} db_name={db_name}")
          # Per-scenario gate-ladder invocation (acquire MOTHERDUCK_TOKEN from Azure KV,
          # CREATE DATABASE pr_e2e_<...> FROM prd, run gate ladder, DROP DATABASE)
          # lands with the milestone harness — see VD-2150.
          PY

  aggregate:
    needs: [run-scenario]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report combined result
        env:
          SCENARIO_RESULT: ${{ needs.run-scenario.result }}
        run: |
          echo "All scenario jobs complete. Combined result: $SCENARIO_RESULT"
          [ "$SCENARIO_RESULT" = "success" ] || { echo "One or more scenarios failed."; exit 1; }
