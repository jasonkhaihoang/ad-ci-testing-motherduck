# Domain CI Configuration — MotherDuck platform
#
# Migrated from Fabric CI bundle to DuckDB/MotherDuck CI bundle (VD-2264).
platform: motherduck

# Short slug identifying this domain's intent context.
intent_slug: dev-sales-pipeline

# Human-readable domain name used in status labels and comments.
domain: sales-pipeline

# KV secret name for the Anthropic Claude API key (used by design-drift gate).
claude_api_key_kv_name: claude-api-key

# Production MotherDuck database name.
prod_db_name: prd

# Prod-state manifest artifact — published by publish-prod-manifest-duckdb.yml on push to main.
prod_manifest_source:
  mode: artifact
  workflow: publish-prod-manifest-duckdb.yml
  artifact_name: prod-manifest-duckdb
