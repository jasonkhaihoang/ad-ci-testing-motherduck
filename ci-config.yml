# Domain CI Configuration — MotherDuck platform
#
# Copy this file to the root of your domain repo as `ci-config.yml`
# and fill in the values. Non-sensitive — do not store as secrets.
# VD Studio populates this file automatically at domain setup time.

# Platform discriminator. Must be exactly "motherduck" for this bundle.
platform: motherduck

# Short slug identifying this domain's intent context. Matches the intent_slug
# registered in VD Studio for this domain.
intent_slug: <domain-name>         # e.g. dev-sales-pipeline

# MotherDuck service token: set MOTHERDUCK_TOKEN_KV_NAME as a GitHub Actions Variable
# (Settings → Secrets and variables → Actions → Variables) — not in this file.

# Production MotherDuck database name. Gates 0–1 render this into the manifest
# via dbt_motherduck_compile (database: prd), so it must match the live prod database.
prod_db_name: prd

# Prod-state manifest artifact — published by publish-prod-manifest-duckdb.yml on push to main.
prod_manifest_source:
  mode: artifact
  workflow: publish-prod-manifest-duckdb.yml
  artifact_name: prod-manifest-duckdb
