version: 2

models:
  - name: dim_opportunity_stage
    meta:
      owner: jason.khai.hoang@acceleratedata.ai
    description: |
      Dimension table summarising pipeline volume per opportunity stage.
      Added for VD-2289/VD-2290 gate-3/gate-4 validation.
    columns:
      - name: stage_name
        description: Salesforce opportunity stage name
        data_type: string
        tests:
          - unique
          - not_null

      - name: opportunity_count
        description: Total number of opportunities in this stage
        data_type: integer
        tests:
          - not_null

      - name: total_amount
        description: Sum of opportunity amounts in this stage
        data_type: double

      - name: avg_probability
        description: Average close probability across opportunities in this stage
        data_type: double

      - name: won_count
        description: Count of closed-won opportunities in this stage
        data_type: integer

      - name: lost_count
        description: Count of closed-lost opportunities in this stage
        data_type: integer

      - name: open_count
        description: Count of currently open opportunities in this stage
        data_type: integer
